; Application configuration
; comments start with ; or #

[DEFAULT]
app_name = ordersvc
base_dir = /srv/${app_name}
log_level = info
timeout = 30

[database]
host = db.internal
port = 5432
name = ${app_name}_prod
dsn = pg://${host}:${port}/${name}

# development overrides
[database.dev]
extends = database
host = localhost
name = ${app_name}_dev

[web]
port = 8080
workers = 4
static_dir = ${base_dir}/static
timeout = 60

[worker]
extends = web
workers = 16
queue = jobs.default
