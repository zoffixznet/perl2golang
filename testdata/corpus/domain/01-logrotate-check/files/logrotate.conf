# Global defaults -- inherited by every stanza unless overridden.
# NB: 'compress' was turned on globally in 2019 after the /var fill incident.
compress
rotate 4
weekly
create 0640 root adm

# main web logs
/var/log/httpd/access.log /var/log/httpd/error.log {
    daily
    rotate 14
    missingok
    delaycompress
    postrotate
        /bin/systemctl reload httpd > /dev/null 2>&1 || true
    endscript
}

# app log -- note: dev team insisted on 90 days retention (ticket OPS-1123)
/var/log/app/app.log {
    daily
    rotate 90
    size 100M
    compress
    sharedscripts
    postrotate
        /bin/kill -HUP `cat /run/app.pid 2>/dev/null` 2>/dev/null || true
    endscript
}

# broken stanza: typo'd directive and bogus rotate count
/var/log/legacy/old.log {
    weekly
    rotate lots
    missignok
}

# stanza with conflicting frequencies (someone merged two configs badly)
/var/log/mail/mail.log {
    daily
    weekly
    rotate 8
    nocompress
}

/var/log/audit/audit.log {
    monthly
    rotate 12
    notifempty
}

# hotfix stanza from 2023-11 -- the closing brace never made it through review
/var/log/cron/cron.log {
    weekly
    rotate 4
