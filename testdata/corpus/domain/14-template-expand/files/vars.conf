# deploy variables, one per line: name = value (values may reference
# other vars with {{name}}; resolution is recursive)
product   = WidgetWorks
env       = staging
region    = eu-west-1
base_host = {{env}}.{{region}}.example.net
app_url   = https://app.{{base_host}}
api_url   = https://api.{{base_host}}/{{api_ver}}
api_ver   = v3
greeting  = Welcome to {{product}} ({{env}})
support   = ops@example.com

# these two were left over from a copy-paste and reference each other;
# the expander must catch the loop, not hang (INC-2019-0142)
loop_a    = see {{loop_b}}
loop_b    = see {{loop_a}}
